{% extends "base.html" %}
{% block title %}Harmonogramy{% endblock %}
{% block content %}
<h2>Harmonogramy</h2>

<p><a href="{{ url_for('new_schedule') }}" style="text-decoration:none;"><button type="button">+ Nowy harmonogram (losuj)</button></a></p>

<ul class="card-list">
    {% for s in schedules %}
    <li>
        <div>
            <strong><a href="{{ url_for('view_schedule', schedule_id=s.id) }}">{{ s.name }}</a></strong>
            <div class="muted">{{ s.start_date }} — {{ s.end_date }}</div>
        </div>
        <form method="post" action="{{ url_for('delete_schedule', schedule_id=s.id) }}" class="inline" onsubmit="return confirm('Usunąć harmonogram {{ s.name }}?');">
            <button type="submit" class="danger">Usuń</button>
        </form>
    </li>
    {% else %}
    <li>Brak harmonogramów. Utwórz pierwszy powyżej.</li>
    {% endfor %}
</ul>
{% endblock %}
